<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Yellow - Night Walking Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "inverse-surface": "#313030",
                        "primary-fixed": "#ffdcc2",
                        "secondary-fixed": "#ffdbd1",
                        "on-surface": "#1c1b1b",
                        "primary-container": "#ff9933",
                        "on-primary-container": "#693800",
                        "surface-container-highest": "#e5e2e1",
                        "tertiary-fixed-dim": "#fbbc00",
                        "on-primary-fixed": "#2e1500",
                        "inverse-primary": "#ffb77a",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f6f3f2",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#6d3a00",
                        "on-tertiary-container": "#594000",
                        "on-tertiary-fixed": "#261a00",
                        "surface-container-high": "#eae7e7",
                        "secondary-container": "#d83900",
                        "on-secondary-fixed": "#3b0900",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-container": "#e2a900",
                        "tertiary-fixed": "#ffdfa0",
                        "surface-tint": "#8f4e00",
                        "surface": "#fcf9f8",
                        "primary": "#8f4e00",
                        "on-secondary-container": "#fffbff",
                        "on-error-container": "#93000a",
                        "surface-dim": "#dcd9d9",
                        "background": "#fcf9f8",
                        "on-secondary-fixed-variant": "#872000",
                        "surface-variant": "#e5e2e1",
                        "on-background": "#1c1b1b",
                        "outline-variant": "#dbc2b0",
                        "secondary-fixed-dim": "#ffb5a0",
                        "primary-fixed-dim": "#ffb77a",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f3f0ef",
                        "on-surface-variant": "#554336",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "outline": "#887364",
                        "error": "#ba1a1a",
                        "surface-container": "#f0eded",
                        "secondary": "#ad2c00",
                        "surface-bright": "#fcf9f8",
                        "tertiary": "#795900"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "stack-lg": "40px",
                        "margin-mobile": "20px",
                        "base": "8px",
                        "stack-sm": "12px",
                        "stack-md": "24px",
                        "touch-target": "56px",
                        "gutter": "16px",
                        "margin-desktop": "40px"
                    },
                    fontFamily: {
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    fontSize: {
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "700" }],
                        "headline-lg-mobile": ["28px", { lineHeight: "36px", fontWeight: "700" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "700" }],
                        "body-lg": ["18px", { lineHeight: "26px", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "800" }],
                        "title-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-night {
            background-color: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 153, 51, 0.2);
        }
        .amber-glow {
            text-shadow: 0 0 20px rgba(255, 153, 51, 0.5);
        }
        .sos-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 69, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(255, 69, 0, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 69, 0, 0); }
        }
        body {
            background-image: radial-gradient(circle at top right, rgba(49, 48, 48, 1) 0%, rgba(28, 27, 27, 1) 100%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="bg-[#1c1b1b] text-surface-container-low min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-inverse-surface shadow-sm dark:shadow-none flex justify-between items-center h-touch-target px-margin-mobile border-b border-transparent">
<button aria-label="Leading Action" class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-200 h-10 w-10 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">flare</span>
</button>
<div class="flex items-center gap-2">
<h1 class="font-display-lg text-display-lg text-primary-container dark:text-primary-fixed text-[24px] leading-none tracking-tighter">Yellow</h1>
</div>
<button aria-label="Trailing Action" class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-200 h-10 w-10 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dark_mode</span>
</button>
</header>
<!-- Main Canvas -->
<main class="pt-[80px] pb-[100px] px-margin-mobile flex flex-col gap-stack-md">
<!-- Status & Weather Chip -->
<div class="flex justify-center mt-2">
<div class="inline-flex items-center gap-2 bg-primary-container/10 border border-primary-container/30 rounded-full px-4 py-2 backdrop-blur-md">
<span class="material-symbols-outlined text-primary-container text-[18px]">nights_stay</span>
<span class="font-label-caps text-label-caps text-primary-fixed tracking-wider uppercase">Clear Night • 18°C</span>
</div>
</div>
<!-- Hero: Distance Counter -->
<section class="flex flex-col items-center justify-center py-stack-sm text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary-fixed amber-glow text-5xl mb-2">42.3 <span class="text-3xl text-primary-fixed-dim">km</span></h2>
<p class="font-title-md text-title-md text-surface-variant/80">remaining to Meerut</p>
</section>
<!-- Progress Tracker (Footstep) -->
<section class="w-full px-2">
<div class="flex justify-between font-label-caps text-label-caps text-surface-variant mb-2">
<span>Start</span>
<span>Destination</span>
</div>
<div class="h-2 w-full bg-surface-variant/20 rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-primary-container to-[#FF4500] w-[65%] rounded-full relative">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-white rounded-full shadow-[0_0_10px_rgba(255,153,51,0.8)] border-2 border-primary-container"></div>
</div>
</div>
<p class="text-center font-label-caps text-label-caps text-primary-fixed mt-3 tracking-widest opacity-80">65% COMPLETED</p>
</section>
<!-- Quick Access Grid (Bento) -->
<section class="grid grid-cols-2 gap-gutter mt-stack-sm">
<!-- Card 1 -->
<button class="glass-night rounded-xl p-4 flex flex-col items-start gap-3 min-h-touch-target active:scale-95 transition-transform duration-200">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container">restaurant</span>
</div>
<div class="text-left">
<h3 class="font-title-md text-[16px] leading-tight text-surface-container-low mb-1">Bhojan Shivir</h3>
<p class="font-label-caps text-[10px] text-surface-variant">1.2 KM AHEAD</p>
</div>
</button>
<!-- Card 2 -->
<button class="glass-night rounded-xl p-4 flex flex-col items-start gap-3 min-h-touch-target active:scale-95 transition-transform duration-200">
<div class="w-10 h-10 rounded-full bg-error/20 flex items-center justify-center border border-error/30">
<span class="material-symbols-outlined text-error-container">medical_services</span>
</div>
<div class="text-left">
<h3 class="font-title-md text-[16px] leading-tight text-surface-container-low mb-1">Medical Camp</h3>
<p class="font-label-caps text-[10px] text-surface-variant">3.5 KM AHEAD</p>
</div>
</button>
<!-- Card 3 (Spans 2 columns) -->
<div class="col-span-2 glass-night rounded-xl p-4 flex items-center justify-between min-h-touch-target relative overflow-hidden">
<div class="relative z-10 flex flex-col items-start text-left">
<h3 class="font-title-md text-title-md text-surface-container-low mb-1">Night Group Active</h3>
<p class="font-body-md text-[14px] text-surface-variant">4 pilgrims nearby walking at your pace.</p>
</div>
<div class="relative z-10 w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center border border-primary-container/50">
<span class="material-symbols-outlined text-primary-container">group</span>
</div>
<!-- Decorative background element for card -->
<div class="absolute -right-10 -bottom-10 w-32 h-32 bg-primary-container/5 rounded-full blur-2xl z-0"></div>
</div>
</section>
</main>
<!-- Global SOS Floating Action Button -->
<button aria-label="Emergency SOS" class="fixed bottom-[96px] right-margin-mobile w-14 h-14 bg-[#FF4500] rounded-full flex items-center justify-center shadow-[0_0_24px_rgba(255,69,0,0.6)] sos-pulse z-40 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-white text-2xl" style="font-variation-settings: 'FILL' 1;">sos</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface dark:bg-inverse-surface shadow-[0_-2px_10px_rgba(255,153,51,0.15)] shadow-lg flex justify-around items-center h-[72px] px-2 border-t border-transparent">
<!-- Active Item (Home/Dashboard) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container dark:bg-primary-fixed dark:text-on-primary-fixed rounded-full px-4 py-1 hover:opacity-80 transition-opacity active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</a>
<!-- Inactive Items -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:opacity-80 transition-opacity active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">map</span>
<span class="font-label-caps text-label-caps mt-1">Map</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:opacity-80 transition-opacity active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">route</span>
<span class="font-label-caps text-label-caps mt-1">Roadmap</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:opacity-80 transition-opacity active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-caps text-label-caps mt-1">Profile</span>
</a>
</nav>
</body></html>
