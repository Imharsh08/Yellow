<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Yellow - Offline State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#313030",
                        "primary-fixed": "#ffdcc2",
                        "secondary-fixed": "#ffdbd1",
                        "on-surface": "#1c1b1b",
                        "primary-container": "#ff9933",
                        "on-primary-container": "#693800",
                        "surface-container-highest": "#e5e2e1",
                        "tertiary-fixed-dim": "#fbbc00",
                        "on-primary-fixed": "#2e1500",
                        "inverse-primary": "#ffb77a",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f6f3f2",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#6d3a00",
                        "on-tertiary-container": "#594000",
                        "on-tertiary-fixed": "#261a00",
                        "surface-container-high": "#eae7e7",
                        "secondary-container": "#d83900",
                        "on-secondary-fixed": "#3b0900",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-container": "#e2a900",
                        "tertiary-fixed": "#ffdfa0",
                        "surface-tint": "#8f4e00",
                        "surface": "#fcf9f8",
                        "primary": "#8f4e00",
                        "on-secondary-container": "#fffbff",
                        "on-error-container": "#93000a",
                        "surface-dim": "#dcd9d9",
                        "background": "#fcf9f8",
                        "on-secondary-fixed-variant": "#872000",
                        "surface-variant": "#e5e2e1",
                        "on-background": "#1c1b1b",
                        "outline-variant": "#dbc2b0",
                        "secondary-fixed-dim": "#ffb5a0",
                        "primary-fixed-dim": "#ffb77a",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f3f0ef",
                        "on-surface-variant": "#554336",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "outline": "#887364",
                        "error": "#ba1a1a",
                        "surface-container": "#f0eded",
                        "secondary": "#ad2c00",
                        "surface-bright": "#fcf9f8",
                        "tertiary": "#795900"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "40px",
                        "margin-mobile": "20px",
                        "base": "8px",
                        "stack-sm": "12px",
                        "stack-md": "24px",
                        "touch-target": "56px",
                        "gutter": "16px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .pulse-slow {
            animation: pulse-slow 3s infinite alternate;
        }
        @keyframes pulse-slow {
            from { opacity: 0.6; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1.02); }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Shell suppressed for focused offline state as per intent/relevance check, but keeping minimal header for context) -->
<header class="w-full flex justify-between items-center h-touch-target px-margin-mobile bg-surface shadow-sm z-50 fixed top-0">
<div class="flex items-center gap-2 text-on-surface-variant cursor-pointer">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</div>
<div class="font-display-lg text-title-md text-primary-container tracking-tight">Yellow</div>
<div class="flex items-center text-outline">
<span class="material-symbols-outlined text-[24px]">settings</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-[80px] pb-[100px]">
<div class="w-full max-w-md flex flex-col items-center text-center space-y-stack-lg">
<!-- Graphic Illustration Area -->
<div class="relative w-48 h-48 flex items-center justify-center fade-in-up">
<!-- Soft glow background -->
<div class="absolute inset-0 bg-primary-container/10 rounded-full blur-3xl pulse-slow"></div>
<!-- Main Icon -->
<div class="relative z-10 w-32 h-32 bg-surface-container-low rounded-full flex items-center justify-center shadow-lg shadow-primary-container/15 border border-surface-container-high">
<span class="material-symbols-outlined text-[64px] text-primary-container/70 font-light" style="font-variation-settings: 'FILL' 0, 'wght' 200;">
                        wifi_off
                    </span>
</div>
<!-- Floating decorative elements -->
<div class="absolute top-4 right-8 w-3 h-3 bg-tertiary-container rounded-full opacity-50 pulse-slow" style="animation-delay: 1s;"></div>
<div class="absolute bottom-8 left-6 w-4 h-4 bg-primary-fixed rounded-full opacity-60 pulse-slow" style="animation-delay: 0.5s;"></div>
</div>
<!-- Primary Messaging -->
<div class="flex flex-col space-y-stack-sm fade-in-up delay-100 max-w-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">You're offline</h1>
<p class="font-body-md text-body-md text-on-surface-variant px-4">
                    Take a deep breath. Your progress is saved and will automatically sync when signal returns.
                </p>
</div>
<!-- Cached Data Card (Glassmorphism/Minimal) -->
<div class="w-full bg-surface-container/50 backdrop-blur-sm border border-outline-variant/30 rounded-2xl p-6 shadow-sm flex flex-col items-center space-y-4 fade-in-up delay-200">
<div class="flex items-center gap-2 text-outline">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">cloud_done</span>
<span class="font-label-caps text-label-caps uppercase tracking-wider">Last Known State</span>
</div>
<div class="flex items-baseline gap-1">
<span class="font-display-lg text-[56px] leading-none text-on-surface-variant/70 font-extrabold tracking-tighter">42.3</span>
<span class="font-title-md text-title-md text-outline">km</span>
</div>
<!-- Upload Queue Indicator -->
<div class="mt-2 inline-flex items-center gap-2 bg-surface rounded-full px-4 py-2 border border-surface-container-high shadow-sm">
<div class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary-container opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-tertiary-container"></span>
</div>
<span class="font-body-md text-[14px] text-on-surface-variant">2 photos waiting to upload</span>
</div>
</div>
</div>
</main>
<!-- Contextual Action Button (Instead of Nav Shell) -->
<div class="fixed bottom-0 w-full px-margin-mobile pb-margin-mobile pt-4 bg-gradient-to-t from-background to-transparent z-40 flex justify-center fade-in-up delay-300">
<button class="w-full max-w-md h-touch-target bg-surface-container-high text-on-surface hover:bg-surface-container-highest active:scale-95 transition-all duration-200 rounded-full font-title-md text-[16px] shadow-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">refresh</span>
            Check for Signal
        </button>
</div>
</body></html>
