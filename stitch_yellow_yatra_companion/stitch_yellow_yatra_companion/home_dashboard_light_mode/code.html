<!-- Interactive Scripts -->
<script>
        // Simple counter animation for distance
        document.addEventListener('DOMContentLoaded', () => {
            const counterElement = document.getElementById('distance-counter');
            const targetDistance = 42.3;
            const duration = 1500; // ms
            const frameRate = 30; // ms per frame
            const totalFrames = duration / frameRate;
            let currentFrame = 0;

            const increment = targetDistance / totalFrames;
            let currentDistance = 0;

            const updateCounter = setInterval(() => {
                currentFrame++;
                currentDistance += increment;
                
                if (currentFrame >= totalFrames) {
                    currentDistance = targetDistance;
                    clearInterval(updateCounter);
                }
                
                counterElement.textContent = currentDistance.toFixed(1);
            }, frameRate);
        });
    </script>
