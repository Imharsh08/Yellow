<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<style>
    body {
      min-height: max(884px, 100dvh);
      background-color: #0a0a0f;
    }
    .glass-night {
        background-color: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 153, 51, 0.2);
    }
  </style>
</head>
<body class="bg-[#0a0a0f] text-surface-container-low font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen pb-[72px] md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#0a0a0f]/80 backdrop-blur-md shadow-sm border-b border-transparent">
<div class="flex justify-between items-center h-touch-target px-margin-mobile">
<button aria-label="Menu" class="text-on-surface-variant hover:bg-surface-container-highest transition-colors active:scale-95 duration-200 w-10 h-10 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">flare</span>
</button>
<h1 class="font-display-lg text-display-lg text-primary-fixed tracking-tight text-[24px] leading-none">Yellow</h1>
<button aria-label="Toggle Dark Mode" class="text-on-surface-variant hover:bg-surface-container-highest transition-colors active:scale-95 duration-200 w-10 h-10 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dark_mode</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-[80px] px-margin-mobile md:px-margin-desktop max-w-3xl mx-auto space-y-stack-lg pb-stack-lg">
<!-- Profile Header Section -->
<section class="mt-stack-md flex flex-col items-center text-center space-y-stack-sm animate-fade-in-up">
<div class="relative group">
<div class="w-32 h-32 rounded-full bg-primary-container/20 border border-primary-container/50 flex items-center justify-center shadow-[0_0_20px_rgba(255,153,51,0.2)] hover:shadow-[0_0_25px_rgba(255,153,51,0.3)] transition-shadow duration-300">
<span class="font-display-lg text-display-lg text-primary-container">AS</span>
</div>
<button class="absolute bottom-0 right-0 w-10 h-10 bg-[#1c1b1b] rounded-full shadow-md flex items-center justify-center border-2 border-[#0a0a0f] hover:bg-inverse-surface transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary-fixed text-xl">edit</span>
</button>
</div>
<div class="space-y-base">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-surface-container-low">Aarav Sharma</h2>
<div class="inline-flex items-center space-x-2 bg-primary-container/10 rounded-full px-4 py-1.5 border border-primary-container/30 backdrop-blur-md">
<span class="material-symbols-outlined text-primary-fixed text-sm" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-caps text-label-caps text-primary-fixed uppercase tracking-wider">Verified Pilgrim</span>
</div>
</div>
</section>
<!-- Current Yatra Stats Card -->
<section class="animate-fade-in-up" style="animation-delay: 100ms;">
<div class="glass-night rounded-xl p-6 relative overflow-hidden">
<!-- Decorative subtle element -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container/10 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
<div class="flex items-center justify-between mb-stack-sm relative z-10">
<h3 class="font-title-md text-title-md text-surface-container-low flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container">route</span>
                        Current Yatra
                    </h3>
<span class="bg-primary-container/20 text-primary-fixed font-label-caps text-label-caps px-3 py-1 rounded-full shadow-sm border border-primary-container/30">Active</span>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-gutter relative z-10">
<div class="bg-white/5 p-4 rounded-lg border border-white/10 flex flex-col justify-center">
<span class="font-label-caps text-label-caps text-surface-variant mb-1">Destination</span>
<span class="font-title-md text-title-md text-primary-fixed">Meerut</span>
</div>
<div class="bg-white/5 p-4 rounded-lg border border-white/10 flex flex-col justify-center">
<span class="font-label-caps text-label-caps text-surface-variant mb-1">Start Point</span>
<span class="font-title-md text-title-md text-surface-container-low">Haridwar</span>
</div>
<div class="bg-white/5 p-4 rounded-lg border border-white/10 flex flex-col justify-center">
<span class="font-label-caps text-label-caps text-surface-variant mb-1">Days Active</span>
<div class="flex items-baseline gap-1">
<span class="font-display-lg text-display-lg text-primary-fixed tracking-tighter">4</span>
<span class="font-body-md text-body-md text-surface-variant">Days</span>
</div>
</div>
</div>
<!-- Simple Progress indicator -->
<div class="mt-stack-sm pt-stack-sm border-t border-white/10 relative z-10">
<div class="flex justify-between font-label-caps text-label-caps text-surface-variant mb-2">
<span>Progress</span>
<span>~60%</span>
</div>
<div class="h-2 w-full bg-surface-variant/20 rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-primary-container to-[#FF4500] rounded-full w-[60%] shadow-[0_0_10px_rgba(255,153,51,0.5)]"></div>
</div>
</div>
</div>
</section>
<!-- Settings & Actions List -->
<section class="animate-fade-in-up" style="animation-delay: 200ms;">
<div class="glass-night rounded-xl overflow-hidden">
<ul class="divide-y divide-white/10">
<li>
<button class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition-colors group min-h-[56px]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-error/20 border border-error/30 flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-error-container">emergency</span>
</div>
<span class="font-title-md text-title-md text-surface-container-low">Emergency Contacts</span>
</div>
<span class="material-symbols-outlined text-surface-variant group-hover:text-primary-container transition-colors">chevron_right</span>
</button>
</li>
<li>
<button class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition-colors group min-h-[56px]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-surface-container-low">lock</span>
</div>
<span class="font-title-md text-title-md text-surface-container-low">Privacy Settings</span>
</div>
<span class="material-symbols-outlined text-surface-variant group-hover:text-primary-container transition-colors">chevron_right</span>
</button>
</li>
<li>
<button class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition-colors group min-h-[56px]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-surface-container-low">help</span>
</div>
<span class="font-title-md text-title-md text-surface-container-low">Help &amp; Support</span>
</div>
<span class="material-symbols-outlined text-surface-variant group-hover:text-primary-container transition-colors">chevron_right</span>
</button>
</li>
</ul>
</div>
</section>
<!-- Logout Button -->
<section class="pt-base animate-fade-in-up" style="animation-delay: 300ms;">
<button class="w-full h-touch-target rounded-full border-2 border-primary-container/30 text-surface-container-low font-title-md text-title-md flex items-center justify-center gap-2 hover:bg-white/5 active:scale-[0.98] transition-all glass-night">
<span class="material-symbols-outlined">logout</span>
                Logout
            </button>
</section>

<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 rounded-t-xl bg-inverse-surface shadow-lg border-t border-transparent pb-safe">
<div class="flex justify-around items-center h-[72px] px-2">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:opacity-80 transition-opacity active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</button>
<!-- Map -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:opacity-80 transition-opacity active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">map</span>
<span class="font-label-caps text-label-caps mt-1">Map</span>
</button>
<!-- Roadmap -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:opacity-80 transition-opacity active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">route</span>
<span class="font-label-caps text-label-caps mt-1">Roadmap</span>
</button>
<!-- Profile (ACTIVE) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 hover:opacity-80 transition-opacity active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-caps text-label-caps mt-1">Profile</span>
</button>
</div>
</nav>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
            opacity: 0;
        }
        /* Handle safe area for bottom nav on modern devices */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</body></html>
