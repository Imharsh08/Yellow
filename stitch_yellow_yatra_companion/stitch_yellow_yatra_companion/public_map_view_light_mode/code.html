<style>
        .filter-chip-active {
            background-color: #ff9933; /* Saffron primary container */
            color: #693800; /* on-primary-container */
            border-color: #ff9933;
        }
        .filter-chip-inactive {
            background-color: #fcf9f8; /* surface */
            color: #554336; /* on-surface-variant */
            border-color: #dbc2b0; /* outline-variant */
        }
        .bottom-sheet-shadow {
            box-shadow: 0 -4px 20px rgba(255, 153, 51, 0.15); /* Saffron tinted shadow for daytime elevation */
        }
        /* Custom map pin styles */
        .pin-bhojan { background-color: #FF9933; }
        .pin-medical { background-color: #d83900; } /* secondary-container */
        .pin-charging { background-color: #0284c7; } /* using a safe blue for charging */
        .pin-vlogs { background-color: #9333ea; } /* using a safe purple for vlogs */

<body class="bg-surface text-on-surface font-body-md min-h-screen relative overflow-hidden flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm shadow-sm flex justify-between items-center h-touch-target px-margin-mobile">
<button class="flex items-center justify-center w-touch-target h-touch-target text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="flare">flare</span>
</button>
<h1 class="font-title-md text-title-md text-primary font-bold">Yellow</h1>
<button class="flex items-center justify-center w-touch-target h-touch-target text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</button>
</header>

<div class="flex gap-2 min-w-max">
<button class="h-[40px] px-4 rounded-full border border-primary-container bg-primary-container text-on-primary-container font-label-caps text-label-caps flex items-center gap-2 active:scale-95 transition-transform">

<button class="h-[40px] px-4 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-caps text-label-caps flex items-center gap-2 active:scale-95 transition-transform hover:bg-surface-container-low">
<span class="w-3 h-3 rounded-full pin-medical"></span>
                    Medical
                </button>
<button class="h-[40px] px-4 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-caps text-label-caps flex items-center gap-2 active:scale-95 transition-transform hover:bg-surface-container-low">
<span class="w-3 h-3 rounded-full pin-charging"></span>
                    Charging
                </button>
<button class="h-[40px] px-4 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-caps text-label-caps flex items-center gap-2 active:scale-95 transition-transform hover:bg-surface-container-low">
<span class="w-3 h-3 rounded-full pin-vlogs"></span>
                    Vlogs

</div>
</div>

<span class="material-symbols-outlined text-[24px]">restaurant</span>
</div>
<div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-primary-container"></div>
</button>

</div>
</button>

<span class="material-symbols-outlined text-[20px]">battery_charging_full</span>

<span class="material-symbols-outlined font-bold text-3xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sos</span>
</button>

<div class="flex-grow">
<div class="flex justify-between items-start">
<div>
<span class="inline-block px-2 py-0.5 rounded-full bg-primary-fixed text-on-primary-fixed-variant font-label-caps text-label-caps mb-1">BHOJAN SHIVIR</span>

<div class="text-right">
